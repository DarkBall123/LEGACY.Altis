;; extDB3 SQL_CUSTOM definition for the LEGACY.Altis key-value store.
;; Install to: @extDB3/sql_custom_v2/legacy_store.ini
;; Loaded by fn_storeInit.sqf via:
;;   9:ADD_DATABASE_PROTOCOL:legacy_altis:SQL_CUSTOM:STORE:legacy_store
;;
;; All values arriving from the mission are pre-escaped (no ':', '~',
;; quote characters), so no input sanitizing surprises are expected.
;; Verify option spelling against the extDB3 wiki for your extDB3
;; version if a call fails with a protocol error.

[Default]
Version = 1
Strip Chars =
Strip Chars Action =

[listKeys]
SQL1_1 = SELECT DISTINCT k FROM kv_store ORDER BY k LIMIT ? OFFSET ?;
SQL1_INPUTS = 1, 2
OUTPUT = 1-STRING

[countChunks]
SQL1_1 = SELECT COUNT(*) FROM kv_store WHERE k = ?;
SQL1_INPUTS = 1
OUTPUT = 1

[getChunk]
SQL1_1 = SELECT v FROM kv_store WHERE k = ? AND i = ?;
SQL1_INPUTS = 1, 2
OUTPUT = 1-STRING

[putChunk]
SQL1_1 = REPLACE INTO kv_store (k, i, v) VALUES (?, ?, ?);
SQL1_INPUTS = 1, 2, 3

[delKey]
SQL1_1 = DELETE FROM kv_store WHERE k = ?;
SQL1_INPUTS = 1
