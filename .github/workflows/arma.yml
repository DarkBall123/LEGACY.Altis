name: Arma

on:
  push:
    branches:
      - main
      - develop
      - cicd/**
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v4

      - name: Validate Config
        run: python3 tools/config_style_checker.py

      - name: Validate Stringtables
        run: python3 tools/stringtable_validator.py

      - name: Check Strings
        run: python3 tools/check_strings.py

      - name: Check for BOM
        uses: arma-actions/bom-check@master
        with:
          path: "."

      - name: Validate function headers
        run: python3 tools/document_functions.py --debug

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v4

      - name: Setup HEMTT
        uses: arma-actions/hemtt@v1
        with:
          version: 'v1.19.1'
          annotate: true

      - name: Run HEMTT check
        run: hemtt check

      - name: Run HEMTT build
        run: hemtt build

      - name: Package mission folder
        run: python3 tools/package_mission.py --output .hemttout/Mali.kunduz_valley

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sof-campaign-${{ github.sha }}-nobin
          path: |
            .hemttout/build
            .hemttout/Mali.kunduz_valley
          include-hidden-files: true
