name: Arma

on:
  push:
    branches:
      - main
      - develop
      - cicd/**
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v4

      - name: Validate Config
        run: python3 tools/config_style_checker.py

      - name: Validate Stringtables
        run: python3 tools/stringtable_validator.py

      - name: Check Strings
        run: python3 tools/check_strings.py

      - name: Check for BOM
        run: python3 tools/check_bom.py

      - name: Validate function headers
        run: python3 tools/document_functions.py --debug

  build:
    runs-on: ubuntu-latest
    needs: validate
    env:
      HEMTT_VERSION: ${{ vars.HEMTT_VERSION || 'v1.19.1' }}
      HEMTT_LINUX_SHA256: ${{ vars.HEMTT_LINUX_SHA256 || 'd503b42b71eb00ec31cca70268896769294aa96d18c1c786bfe3267681ba4d7f' }}
      HEMTT_BUILD_ARGS: ${{ vars.HEMTT_BUILD_ARGS || '--no-bin --no-rap' }}
      MISSION_PBO_NAME: ${{ vars.MISSION_PBO_NAME || 'ChudoYudo.yulakia' }}
      MISSION_OUTPUT_DIR: .hemttout
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v4

      - name: Setup HEMTT
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/hemtt-linux-x64.zip"
          install_dir="$RUNNER_TEMP/hemtt"
          curl --fail --location \
            --retry 5 \
            --retry-all-errors \
            --output "$archive" \
            "https://github.com/BrettMayson/HEMTT/releases/download/${HEMTT_VERSION}/linux-x64.zip"
          echo "${HEMTT_LINUX_SHA256}  ${archive}" | sha256sum --check -
          mkdir -p "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          chmod +x "$install_dir/hemtt"
          echo "$install_dir" >> "$GITHUB_PATH"
          # HEMTT 1.19.1 prints its version correctly but exits with status 1.
          "$install_dir/hemtt" --version || test "$?" -eq 1

      - name: Run HEMTT check
        run: hemtt check

      - name: Run HEMTT build
        run: hemtt build

      - name: Package mission folder
        run: python3 tools/package_mission.py --output ".hemttout/${MISSION_PBO_NAME}"

      - name: Package mission PBO
        run: python3 tools/package_mission_pbo.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChudoYudo.yulakia-${{ github.sha }}-nobin
          path: |
            .hemttout/build
            .hemttout/${{ env.MISSION_PBO_NAME }}
            .hemttout/${{ env.MISSION_PBO_NAME }}.pbo
          include-hidden-files: true

      - name: Upload deployment PBO
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: mission-pbo-${{ github.sha }}
          path: .hemttout/${{ env.MISSION_PBO_NAME }}.pbo
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    environment: production
    concurrency:
      group: production-mission-deploy
      cancel-in-progress: false
    env:
      MISSION_PBO_NAME: ${{ vars.MISSION_PBO_NAME || 'ChudoYudo.yulakia' }}
      MISSION_OUTPUT_DIR: .hemttout
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '21' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
      DEPLOY_FTP_PASSIVE: ${{ vars.DEPLOY_FTP_PASSIVE || 'true' }}
      DEPLOY_FTP_TLS: ${{ vars.DEPLOY_FTP_TLS || 'off' }}
      DEPLOY_REMOTE_MISSIONS_DIR: ${{ vars.DEPLOY_REMOTE_MISSIONS_DIR || '/MPMissions' }}
      DEPLOY_BACKUP_EXISTING: ${{ vars.DEPLOY_BACKUP_EXISTING || 'true' }}
    steps:
      - name: Checkout deployment tools
        uses: actions/checkout@v4

      - name: Download mission PBO
        uses: actions/download-artifact@v4
        with:
          name: mission-pbo-${{ github.sha }}
          path: .hemttout

      - name: Publish mission PBO
        run: python3 tools/deploy_mission_ftp.py
